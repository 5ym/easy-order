services:
  easyo:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_PATH: /data/easy-order.sqlite
      # Required for SvelteKit's CSRF origin check when behind a proxy.
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    volumes:
      # SQLite lives on a named volume — no separate database service.
      - easyo-data:/data

volumes:
  easyo-data:
